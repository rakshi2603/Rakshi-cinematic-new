name: Build Rakshi Cinematic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Base Project
        run: |
          unzip -o "rakshi-cinematic-app*.zip"
          mkdir -p app/src/main/java/com/rakshi/cinematic

      - name: Write Engine and Compose UI
        run: |
          cat << 'EOF' > app/src/main/java/com/rakshi/cinematic/MainActivity.kt
          package com.rakshi.cinematic

          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper

          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          import androidx.lifecycle.lifecycleScope

          import androidx.media3.common.MediaItem
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.EditedMediaItemSequence
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.ProgressHolder
          import androidx.media3.transformer.Transformer

          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.channels.awaitClose
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.callbackFlow
          import kotlinx.coroutines.flow.flowOn
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import java.io.File

          data class HighlightSegment(
              val sourceUri: Uri,
              val startMs: Long,
              val endMs: Long
          ) {
              val durationMs: Long
                  get() = endMs - startMs
          }

          object VideoAnalysisEngine {
              fun selectClips(
                  durationMs: Long,
                  uri: Uri,
                  targetMs: Long = 60_000L
              ): List<HighlightSegment> {
                  require(durationMs > 0L) {
                      "Could not read a valid video duration."
                  }
                  require(targetMs > 0L)

                  val selectedMs = minOf(durationMs, targetMs)
                  val segmentCount = minOf(
                      10L,
                      (selectedMs / 1000L).coerceAtLeast(1L)
                  ).toInt()

                  val baseLength = selectedMs / segmentCount
                  val remainder = selectedMs % segmentCount
                  val unusedMs = durationMs - selectedMs

                  var consumedMs = 0L

                  return List(segmentCount) { index ->
                      val lengthMs = baseLength +
                          if (index.toLong() < remainder) 1L else 0L

                      val gapOffset = if (segmentCount > 1) {
                          unusedMs * index / (segmentCount - 1)
                      } else {
                          unusedMs / 2L
                      }

                      val startMs = consumedMs + gapOffset
                      consumedMs += lengthMs

                      HighlightSegment(
                          sourceUri = uri,
                          startMs = startMs,
                          endMs = startMs + lengthMs
                      )
                  }
              }
          }

          class SimpleRenderEngine(
              private val context: Context
          ) {
              sealed interface RenderState {
                  data class Progress(
                      val percentage: Int
                  ) : RenderState

                  data class Completed(
                      val file: File
                  ) : RenderState

                  data class Error(
                      val message: String
                  ) : RenderState
              }

              fun exportReel(
                  cuts: List<HighlightSegment>,
                  outputFile: File
              ): Flow<RenderState> = callbackFlow {
                  val handler = Handler(Looper.getMainLooper())
                  var transformer: Transformer? = null
                  var progressTask: Runnable? = null
                  var finished = false

                  try {
                      require(cuts.isNotEmpty()) {
                          "No clips selected."
                      }

                      cuts.forEach { cut ->
                          require(
                              cut.startMs >= 0L &&
                              cut.endMs > cut.startMs
                          ) {
                              "Invalid clip boundaries."
                          }
                      }

                      outputFile.parentFile?.let { directory ->
                          check(
                              directory.isDirectory ||
                              directory.mkdirs()
                          ) {
                              "Could not create output directory."
                          }
                      }

                      if (outputFile.exists()) {
                          check(outputFile.delete()) {
                              "Could not replace output file."
                          }
                      }

                      val items = cuts.map { cut ->
                          val clipping =
                              MediaItem.ClippingConfiguration.Builder()
                                  .setStartPositionMs(cut.startMs)
                                  .setEndPositionMs(cut.endMs)
                                  .build()

                          val mediaItem = MediaItem.Builder()
                              .setUri(cut.sourceUri)
                              .setClippingConfiguration(clipping)
                              .build()

                          EditedMediaItem.Builder(mediaItem).build()
                      }

                      val sequence = EditedMediaItemSequence(items)
                      val composition =
                          Composition.Builder(listOf(sequence)).build()

                      val exporter = Transformer.Builder(context)
                          .addListener(
                              object : Transformer.Listener {
                                  override fun onCompleted(
                                      composition: Composition,
                                      exportResult: ExportResult
                                  ) {
                                      finished = true
                                      trySend(RenderState.Progress(100))
                                      trySend(
                                          RenderState.Completed(outputFile)
                                      )
                                      close()
                                  }

                                  override fun onError(
                                      composition: Composition,
                                      exportResult: ExportResult,
                                      exportException: ExportException
                                  ) {
                                      finished = true
                                      trySend(
                                          RenderState.Error(
                                              exportException.message
                                                  ?: "Export failed."
                                          )
                                      )
                                      close()
                                  }
                              }
                          )
                          .build()

                      transformer = exporter
                      val holder = ProgressHolder()

                      val poller = object : Runnable {
                          override fun run() {
                              if (finished || isClosedForSend) {
                                  return
                              }

                              try {
                                  val state =
                                      exporter.getProgress(holder)

                                  if (
                                      state ==
                                      Transformer.PROGRESS_STATE_AVAILABLE
                                  ) {
                                      trySend(
                                          RenderState.Progress(
                                              holder.progress
                                                  .coerceIn(0, 100)
                                          )
                                      )
                                  }

                                  handler.postDelayed(this, 300L)
                              } catch (error: Exception) {
                                  finished = true
                                  trySend(
                                      RenderState.Error(
                                          error.message
                                              ?: "Progress check failed."
                                      )
                                  )
                                  close()
                              }
                          }
                      }

                      progressTask = poller
                      exporter.start(
                          composition,
                          outputFile.absolutePath
                      )
                      handler.postDelayed(poller, 200L)
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (error: Exception) {
                      finished = true
                      trySend(
                          RenderState.Error(
                              error.message
                                  ?: "Could not initialize export."
                          )
                      )
                      close()
                  }

                  awaitClose {
                      finished = true

                      progressTask?.let {
                          handler.removeCallbacks(it)
                      }

                      val activeTransformer = transformer
                      if (activeTransformer != null) {
                          if (
                              Looper.myLooper() ==
                              Looper.getMainLooper()
                          ) {
                              activeTransformer.cancel()
                          } else {
                              handler.post {
                                  activeTransformer.cancel()
                              }
                          }
                      }
                  }
              }.flowOn(Dispatchers.Main.immediate)
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  val renderEngine =
                      SimpleRenderEngine(applicationContext)

                  setContent {
                      MaterialTheme {
                          var statusMessage by remember {
                              mutableStateOf(
                                  "Select GoPro footage to begin."
                              )
                          }
                          var isAnalyzing by remember {
                              mutableStateOf(false)
                          }
                          var isRendering by remember {
                              mutableStateOf(false)
                          }
                          var renderProgress by remember {
                              mutableIntStateOf(0)
                          }
                          var cuts by remember {
                              mutableStateOf(
                                  emptyList<HighlightSegment>()
                              )
                          }
                          var exportedPath by remember {
                              mutableStateOf<String?>(null)
                          }

                          val picker =
                              rememberLauncherForActivityResult(
                                  ActivityResultContracts.GetContent()
                              ) { uri: Uri? ->
                                  if (uri != null) {
                                      isAnalyzing = true
                                      cuts = emptyList()
                                      exportedPath = null
                                      statusMessage =
                                          "Reading video duration..."

                                      lifecycleScope.launch {
                                          try {
                                              val durationMs =
                                                  withContext(
                                                      Dispatchers.IO
                                                  ) {
                                                      val retriever =
                                                          MediaMetadataRetriever()

                                                      try {
                                                          retriever
                                                              .setDataSource(
                                                                  applicationContext,
                                                                  uri
                                                              )

                                                          val duration =
                                                              retriever
                                                                  .extractMetadata(
                                                                      MediaMetadataRetriever
                                                                          .METADATA_KEY_DURATION
                                                                  )
                                                                  ?.toLongOrNull()

                                                          require(
                                                              duration != null &&
                                                              duration > 0L
                                                          ) {
                                                              "Cannot read this video's duration."
                                                          }

                                                          duration
                                                      } finally {
                                                          try {
                                                              retriever.release()
                                                          } catch (
                                                              _: Exception
                                                          ) {
                                                          }
                                                      }
                                                  }

                                              cuts =
                                                  VideoAnalysisEngine
                                                      .selectClips(
                                                          durationMs,
                                                          uri
                                                      )

                                              val seconds =
                                                  cuts.sumOf {
                                                      it.durationMs
                                                  } / 1000.0

                                              statusMessage =
                                                  "Ready: ${cuts.size} clips, ${seconds}s total."
                                          } catch (
                                              cancelled:
                                                  CancellationException
                                          ) {
                                              throw cancelled
                                          } catch (error: Exception) {
                                              statusMessage =
                                                  error.message
                                                      ?: "Could not read video."
                                          } finally {
                                              isAnalyzing = false
                                          }
                                      }
                                  }
                              }

                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color(0xFF0F1015)
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .systemBarsPadding()
                                      .padding(20.dp),
                                  horizontalAlignment =
                                      Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      text = "RAKSHI CINEMATIC",
                                      color = Color.White,
                                      fontSize = 24.sp,
                                      fontWeight = FontWeight.Bold
                                  )

                                  Text(
                                      text = "LOCAL VIDEO EDITOR",
                                      color = Color(0xFFFF5722),
                                      fontSize = 12.sp,
                                      modifier =
                                          Modifier.padding(top = 6.dp)
                                  )

                                  Spacer(
                                      Modifier.height(18.dp)
                                  )

                                  Text(
                                      text = statusMessage,
                                      color = Color.LightGray,
                                      fontSize = 14.sp
                                  )

                                  Spacer(
                                      Modifier.height(12.dp)
                                  )

                                  if (isAnalyzing) {
                                      CircularProgressIndicator(
                                          color = Color(0xFFFF5722)
                                      )
                                  }

                                  if (isRendering) {
                                      LinearProgressIndicator(
                                          progress = {
                                              renderProgress / 100f
                                          },
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .height(8.dp),
                                          color = Color(0xFFFF5722)
                                      )

                                      Text(
                                          text =
                                              "$renderProgress% exported",
                                          color = Color.White,
                                          modifier = Modifier
                                              .padding(top = 8.dp)
                                      )
                                  }

                                  Spacer(
                                      Modifier.height(12.dp)
                                  )

                                  Text(
                                      text =
                                          "Evenly spaced clip selection • Up to 60 seconds",
                                      color = Color.Gray,
                                      fontSize = 12.sp
                                  )

                                  LazyColumn(
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxWidth()
                                          .padding(vertical = 12.dp)
                                  ) {
                                      itemsIndexed(cuts) {
                                          index, cut ->

                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(
                                                      vertical = 4.dp
                                                  )
                                                  .background(
                                                      Color(0xFF1B1D26),
                                                      RoundedCornerShape(
                                                          10.dp
                                                      )
                                                  )
                                                  .padding(12.dp),
                                              horizontalArrangement =
                                                  Arrangement.SpaceBetween
                                          ) {
                                              Text(
                                                  text =
                                                      "Clip ${index + 1}",
                                                  color = Color.White
                                              )

                                              Text(
                                                  text =
                                                      "${cut.startMs / 1000.0}s – ${cut.endMs / 1000.0}s",
                                                  color =
                                                      Color.LightGray
                                              )
                                          }
                                      }
                                  }

                                  exportedPath?.let { path ->
                                      Text(
                                          text = "Saved:\n$path",
                                          color = Color(0xFF4CAF50),
                                          fontSize = 12.sp,
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(bottom = 12.dp)
                                      )
                                  }

                                  Button(
                                      onClick = {
                                          picker.launch("video/*")
                                      },
                                      enabled =
                                          !isAnalyzing &&
                                          !isRendering,
                                      modifier =
                                          Modifier.fillMaxWidth()
                                  ) {
                                      Text("Select GoPro Footage")
                                  }

                                  Button(
                                      onClick = {
                                          val selectedCuts =
                                              cuts.toList()

                                          isRendering = true
                                          renderProgress = 0
                                          exportedPath = null
                                          statusMessage =
                                              "Exporting locally..."

                                          lifecycleScope.launch {
                                              try {
                                                  val directory =
                                                      applicationContext
                                                          .getExternalFilesDir(
                                                              Environment
                                                                  .DIRECTORY_MOVIES
                                                          )
                                                          ?: error(
                                                              "Movie storage is unavailable."
                                                          )

                                                  val output = File(
                                                      directory,
                                                      "RAKSHI_REEL_${System.currentTimeMillis()}.mp4"
                                                  )

                                                  renderEngine
                                                      .exportReel(
                                                          selectedCuts,
                                                          output
                                                      )
                                                      .collect { state ->
                                                          when (state) {
                                                              is SimpleRenderEngine
                                                                  .RenderState
                                                                  .Progress -> {
                                                                  renderProgress =
                                                                      state.percentage
                                                              }

                                                              is SimpleRenderEngine
                                                                  .RenderState
                                                                  .Completed -> {
                                                                  exportedPath =
                                                                      state.file
                                                                          .absolutePath
                                                                  statusMessage =
                                                                      "Export complete."
                                                              }

                                                              is SimpleRenderEngine
                                                                  .RenderState
                                                                  .Error -> {
                                                                  statusMessage =
                                                                      "Export failed: ${state.message}"
                                                              }
                                                          }
                                                      }
                                              } catch (
                                                  cancelled:
                                                      CancellationException
                                              ) {
                                                  throw cancelled
                                              } catch (
                                                  error: Exception
                                              ) {
                                                  statusMessage =
                                                      "Export failed: ${error.message}"
                                              } finally {
                                                  isRendering = false
                                              }
                                          }
                                      },
                                      enabled =
                                          cuts.isNotEmpty() &&
                                          !isAnalyzing &&
                                          !isRendering,
                                      modifier =
                                          Modifier.fillMaxWidth(),
                                      colors =
                                          ButtonDefaults.buttonColors(
                                              containerColor =
                                                  Color(0xFFFF5722)
                                          )
                                  ) {
                                      Text("Export Reel")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RakshiCinematicAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
